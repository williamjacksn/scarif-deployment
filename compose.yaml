services:
  birthdayfeed:
    build: https://github.com/williamjacksn/birthdayfeed.git
    image: scarif-birthdayfeed
    init: true
    pull_policy: build
    restart: unless-stopped

  caddy:
    build: caddy
    image: scarif-caddy
    ports:
      - 80:80
      - 443:443
    pull_policy: build
    restart: unless-stopped
    volumes:
      - caddy-config:/config
      - caddy-data:/data
    working_dir: /etc/caddy

  kuma:
    image: louislam/uptime-kuma:2.4.0
    pull_policy: always
    restart: unless-stopped
    volumes:
      - /home/rocky/kuma:/app/data

  lpb:
    build: https://github.com/williamjacksn/license-plate-bingo.git
    environment:
      DB: /app/.local/db.sqlite
    image: scarif-license-plate-bingo
    init: true
    pull_policy: build
    restart: unless-stopped
    volumes:
      - /home/rocky/lpb:/app/.local

volumes:
  caddy-config:
  caddy-data:
